name: Scrape skating schedules

on:
  schedule:
    # Runs on odd days of the month at 12:00 UTC (~8am Ottawa in summer,
    # ~7am in winter). Scheduled workflows only fire on the default branch.
    - cron: "0 12 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated schedule data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet || git commit -m "Update skating schedule data"
          git push
