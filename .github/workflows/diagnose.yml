name: Diagnose Jim Durrell adult skate times

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Jim Durrell adult skate activities
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          url = "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/jim-durrell-recreation-centre"
          matches = [a for a in data["activity"] if a["facilityUrl"] == url and a["name"] == "adult skate 18+"]
          for a in matches:
              print(a)

          print("--- sandy hill figure skate check ---")
          sh_url = "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/sandy-hill-arena"
          fig = [a for a in data["activity"] if a["facilityUrl"] == sh_url and a["name"] == "figure skate"]
          for a in fig:
              print(a)
          EOF
