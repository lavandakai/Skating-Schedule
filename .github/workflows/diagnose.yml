name: Diagnose Canterbury adult skate

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Canterbury adult skate activities
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          url = "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/canterbury-recreation-complex"
          matches = [a for a in data["activity"] if a["facilityUrl"] == url and a["name"] == "adult skate"]
          for a in matches:
              print(a)

          print("--- checking if any OTHER rink also uses 'adult skate' (no 18+) ---")
          others = sorted({a["facilityUrl"] for a in data["activity"] if a["name"] == "adult skate"})
          print(others)
          EOF
