name: Diagnose Sandy Hill Saturday figure skate gap

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the Saturday figure skate activity and its cancellation notice
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          url = "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/sandy-hill-arena"
          matches = [a for a in data["activity"] if a["facilityUrl"] == url and a["name"] in ("figure skate", "figure skate 6+")]
          html_by_id = {h["id"]: h["html"] for h in data["html"]}

          for a in matches:
              print(a)

          eids = sorted({a.get("exceptionsHtmlId") for a in matches if a.get("exceptionsHtmlId") is not None})
          for eid in eids:
              print(f"--- html for exceptionsHtmlId={eid} ---")
              print(html_by_id.get(eid, "(none)"))
          EOF
