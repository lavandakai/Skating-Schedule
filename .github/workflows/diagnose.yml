name: Diagnose fall schedule rinks

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect activity names for the rinks in question
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          urls = {
              "MacQuarrie": "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/bob-macquarrie-recreation-complex-orleans",
              "Minto": "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/minto-recreation-complex-barrhaven",
              "Tom Brown": "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/tom-brown-arena",
              "St-Laurent": "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/st-laurent-complex",
              "Grandmaitre": "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/bernard-grandmaitre-arena",
          }

          known = {"public skate", "family skate", "adult skate 18+", "adult skate", "figure skate", "figure skate 6+"}

          for label, url in urls.items():
              matches = [a for a in data["activity"] if a["facilityUrl"] == url]
              names = sorted({a["name"] for a in matches})
              print(f"=== {label} ({url}) ===")
              print("all activity names:", names)
              unknown = [n for n in names if n not in known and n != "table tennis" and "hockey" not in n and "ringette" not in n and "stick and puck" not in n and "shinny" not in n]
              if unknown:
                  print("UNRECOGNIZED skate-related names:", unknown)
              for a in matches:
                  if a["name"] in known:
                      print(" ", a["name"], a["weekday"], a["startTime"], "-", a["endTime"], a["startDate"], "to", a["endDate"], "eid=", a.get("exceptionsHtmlId"), "reservation=", a.get("reservationRequired"))
              print()
          EOF
