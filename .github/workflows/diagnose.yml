name: Diagnose Fred Barrett figure skate

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Fred Barrett figure skate activities
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          url = "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/fred-barrett-arena"
          matches = [a for a in data["activity"] if a["facilityUrl"] == url]
          names = sorted({a["name"] for a in matches})
          print("Fred Barrett activity names:", names)
          for a in matches:
              if a["name"] == "figure skate":
                  print(a)

          print("--- all Fred Barrett friday activities ---")
          for a in matches:
              if a.get("weekday") == "friday":
                  print(a)
          EOF
