name: Diagnose ottawa.ca block
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Try fetching with headless Chromium
        run: |
          python3 - <<'EOF'
          from playwright.sync_api import sync_playwright

          url = "https://ottawa.ca/en/recreation-and-parks/facilities/place-listing/sandy-hill-arena"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              response = page.goto(url, wait_until="networkidle", timeout=45000)
              print("STATUS:", response.status if response else None)
              content = page.content()
              print("LENGTH:", len(content))
              has_skating = "Drop-in schedule - skating" in content or "skating" in content.lower()
              print("HAS_SKATING_TEXT:", has_skating)
              print("SNIPPET:", content[:1500])
              browser.close()
          EOF
