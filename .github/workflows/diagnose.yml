name: Diagnose Jim Durrell Sept 15 gap

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Jim Durrell exceptionsHtmlId=46 cancellation notice
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          html_by_id = {h["id"]: h["html"] for h in data["html"]}
          print("html for id=46:")
          print(html_by_id.get(46, "(missing)"))
          EOF
