name: Diagnose ottrec data source
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect schema and top-level keys of latest export
        run: |
          curl -sS -A "Mozilla/5.0" "https://data.ottrec.ca/export/schema.json" -o schema.json
          echo "----- schema.json (first 6000 chars) -----"
          head -c 6000 schema.json
          echo
          echo "----- fetching latest.json -----"
          curl -sS -A "Mozilla/5.0" "https://data.ottrec.ca/export/latest.json" -o latest.json
          wc -c latest.json
          echo "----- top-level keys -----"
          python3 -c "
          import json
          d = json.load(open('latest.json'))
          for k in d:
              v = d[k]
              print(k, type(v), len(v) if hasattr(v, '__len__') else '')
          "
