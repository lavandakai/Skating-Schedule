name: Diagnose ottrec data source
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml requests

      - name: Inspect data.ottrec.ca structure
        run: |
          python3 - <<'EOF'
          import requests
          from bs4 import BeautifulSoup

          r = requests.get("https://data.ottrec.ca/", headers={"User-Agent": "Mozilla/5.0"})
          print("STATUS", r.status_code, "LEN", len(r.text))
          soup = BeautifulSoup(r.text, "lxml")

          text = r.text
          idx = text.lower().find("sandy hill")
          print("----- 'sandy hill' context -----")
          print(text[max(0,idx-500):idx+500] if idx != -1 else "NOT FOUND")

          idx2 = text.lower().find("skat")
          print("----- 'skat' context -----")
          print(text[max(0,idx2-500):idx2+500] if idx2 != -1 else "NOT FOUND")

          print("----- headings -----")
          for h in soup.find_all(["h1","h2","h3","h4"]):
              print(repr(h.get_text(strip=True)))

          print("----- table row sample (first 3 rows w/ export links) -----")
          rows = soup.find_all("tr")
          print("num tr:", len(rows))
          for row in rows[:5]:
              print(row.get_text(" ", strip=True)[:300])

          print("----- list items sample -----")
          items = soup.find_all("li")
          print("num li:", len(items))
          for li in items[:5]:
              print(li.get_text(" ", strip=True)[:300])
          EOF
