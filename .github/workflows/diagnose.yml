name: Diagnose ottrec data source
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect activity entries for our rinks
        run: |
          curl -sS -A "Mozilla/5.0" "https://data.ottrec.ca/export/latest.json" -o latest.json
          python3 - <<'EOF'
          import json

          d = json.load(open("latest.json"))
          activities = d["activity"]
          facilities = d["facility"]
          html_by_id = {h["id"]: h["html"] for h in d["html"]}

          rink_urls = [
              "sandy-hill-arena",
              "jim-durrell-recreation-centre",
              "fred-barrett-arena",
              "tom-brown-arena",
          ]

          print("----- attribution -----")
          for a in d["attribution"]:
              print(a["text"])

          print("----- distinct activity names containing 'skat' -----")
          names = sorted(set(a["name"] for a in activities if "skat" in a["name"].lower()))
          for n in names:
              print(repr(n))

          for slug in rink_urls:
              print(f"\n===== {slug} =====")
              matches = [a for a in activities if slug in a["facilityUrl"] and "skat" in a["name"].lower()]
              print("count:", len(matches))
              for m in matches[:8]:
                  print(json.dumps(m, ensure_ascii=False))
              exc_ids = set(m.get("exceptionsHtmlId") for m in matches if m.get("exceptionsHtmlId"))
              for eid in exc_ids:
                  print("EXCEPTION HTML", eid, ":", html_by_id.get(eid, "")[:500])
          EOF
