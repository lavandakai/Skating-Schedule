name: Diagnose Canterbury Recreation Complex

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Canterbury activities in the dataset
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://data.ottrec.ca/export/latest.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)

          urls = sorted({a["facilityUrl"] for a in data["activity"] if "canterbury" in a["facilityUrl"].lower()})
          print("matching facility URLs:", urls)

          for u in urls:
              matches = [a for a in data["activity"] if a["facilityUrl"] == u]
              names = sorted({a["name"] for a in matches})
              print(u, "-> activity names:", names)
              for a in matches:
                  if a["name"] in ("public skate", "family skate", "adult skate 18+", "figure skate"):
                      print(" ", a)
          EOF
